<section
  class="hero"
  id="experience"
  #heroSection
>

  <div class="hero-glow"></div>


  <!-- LEFT COPY -->

  <div
    class="hero-copy hero-copy-left"
    #leftCopy
  >

    <p class="eyebrow">
      Crafted cold. Served different.
    </p>

    <h1>
      NOT JUST
      <span>COFFEE.</span>
    </h1>

  </div>


  <!-- PRODUCT -->

  <div
    class="product-stage"
    #productStage
  >

    <div class="product-glow"></div>

    <span class="orbit orbit-one"></span>
    <span class="orbit orbit-two"></span>

    <div class="product-visual">

      <img
        #heroProduct
        src="/images/sipora-caramel-cloud.png"
        alt="SIPORA Caramel Cloud Frappé"
        class="hero-product"
        draggable="false"
      >

    </div>

  </div>


  <!-- RIGHT COPY -->

  <div
    class="hero-copy hero-copy-right"
    #rightCopy
  >

    <p>
      IT'S A
    </p>

    <h2>
      MOOD<span>.</span>
    </h2>

    <span class="description">
      Cold brews, creamy frappés and flavours made
      for moments worth remembering.
    </span>

  </div>


  <!-- MOBILE MESSAGE -->

  <div
    class="hero-mobile-copy"
    #mobileCopy
  >

    <p>
      IT'S A
    </p>

    <h2>
      MOOD<span>.</span>
    </h2>

    <span>
      Cold brews, creamy frappés and flavours made
      for moments worth remembering.
    </span>

  </div>


  <!-- BOTTOM -->

  <div
    class="hero-bottom"
    #heroBottom
  >

    <span class="edition">
      SIPORA / 001
    </span>

    <a
      href="#flavours"
      class="scroll-indicator"
      aria-label="Explore SIPORA flavours"
    >

      <span>
        Explore
      </span>

      <div class="scroll-line"></div>

    </a>

    <span class="edition">
      KARACHI / PK
    </span>

  </div>

</section>
